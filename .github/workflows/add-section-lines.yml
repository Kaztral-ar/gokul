name: Add section lines

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Add section lines')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add separators
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.projects-section{padding:clamp(30px,4vw,42px) 0 clamp(38px,5vw,50px)}'
          new = '.projects-section{padding:clamp(30px,4vw,42px) 0 clamp(38px,5vw,50px)}.projects-section:before,.contact:before{content:\"\";display:block;height:2px;background:linear-gradient(to right,var(--accent) 0 7%,var(--line) 7% 100%);margin:0 0 28px}'
          if old not in s:
              raise SystemExit('target css not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add section lines"
          rm -f .github/workflows/add-section-lines.yml
          git add .github/workflows/add-section-lines.yml
          git commit -m "Remove section line workflow"
          git push
