name: Shrink project cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Shrink project cards')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make project cards smaller
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.project{position:relative;display:flex;align-items:center;gap:11px;width:100%;height:92px;min-height:92px;', '.project{position:relative;display:flex;align-items:center;gap:9px;width:100%;height:82px;min-height:82px;')
          s = s.replace('padding:9px 11px;border:1px solid #e2e2e2;border-radius:9px;background:#fff;text-decoration:none;color:inherit;transition:transform .18s,border-color .18s}.project:before', 'padding:7px 9px;border:1px solid #e2e2e2;border-radius:9px;background:#fff;text-decoration:none;color:inherit;transition:transform .18s,border-color .18s}.project:before', 1)
          s = s.replace('.icon{width:38px;height:38px;flex:0 0 38px;', '.icon{width:34px;height:34px;flex:0 0 34px;', 1)
          s = s.replace('font-size:17px;background:var(--soft)', 'font-size:15px;background:var(--soft)', 1)
          s = s.replace('.project-name{display:block;font-size:14px;', '.project-name{display:block;font-size:12px;', 1)
          s = s.replace('.project-desc{display:block;font-size:10px;line-height:1.45;', '.project-desc{display:block;font-size:9px;line-height:1.35;', 1)
          s = s.replace('.project-tree{position:relative;margin-left:8px;padding-left:42px;', '.project-tree{position:relative;margin-left:8px;padding-left:34px;', 1)
          s = s.replace('.project:before{content:\'\';position:absolute;left:-42px;width:41px;', '.project:before{content:\'\';position:absolute;left:-34px;width:33px;', 1)
          s = s.replace('.project{max-width:100%;height:112px;min-height:112px}', '.project{max-width:100%;height:82px;min-height:82px}', 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Shrink project cards"
          rm -f .github/workflows/shrink-projects.yml
          git add .github/workflows/shrink-projects.yml
          git commit -m "Remove project resize workflow"
          git push
