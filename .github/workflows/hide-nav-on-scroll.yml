name: Hide nav on scroll

on:
  push:
    branches: [main]

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Hide nav until scroll stops')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = ".site-nav{position:fixed;right:22px;top:50%;transform:translateY(-50%);"
          new = ".site-nav{position:fixed;right:22px;top:50%;transform:translateY(-50%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s;"
          if old in s and ".site-nav.is-visible" not in s:
              s = s.replace(old, new, 1)
              marker = "</style>"
              css = ".site-nav.is-visible{opacity:1;visibility:visible;pointer-events:auto}"
              s = s.replace(marker, css + marker, 1)
              marker = "</body>"
              js = '''<script>\n(function(){const nav=document.getElementById('siteNav');if(!nav)return;let timer;function showNav(){nav.classList.add('is-visible');clearTimeout(timer);timer=setTimeout(()=>nav.classList.remove('is-visible'),900)}window.addEventListener('scroll',showNav,{passive:true});window.addEventListener('touchmove',showNav,{passive:true});window.addEventListener('wheel',showNav,{passive:true});nav.addEventListener('pointerenter',()=>nav.classList.add('is-visible'));nav.addEventListener('pointerleave',()=>{clearTimeout(timer);timer=setTimeout(()=>nav.classList.remove('is-visible'),900)});})();</script>\n'''
              s = s.replace(marker, js + marker, 1)
              p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/hide-nav-on-scroll.yml
          git commit -m "Hide nav until scroll stops" --allow-empty
          git rm .github/workflows/hide-nav-on-scroll.yml
          git commit -m "Remove temporary nav workflow"
          git push
