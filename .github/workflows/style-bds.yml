name: Style BDS intro
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Style BDS intro')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update intro styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.intro-highlight{color:var(--accent);font-weight:600}', '.intro-highlight{color:#b94a48;font-weight:600}')
          s=s.replace("<span class=\"intro-highlight\">developer and BDS student</span>", "developer and <span class=\"intro-highlight\">BDS</span> student")
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Style BDS intro"
          rm -f .github/workflows/style-bds.yml
          git add .github/workflows/style-bds.yml
          git commit -m "Remove BDS style workflow"
          git push
