name: Update intro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Update intro text')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update intro
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'BDS student and a developer. I build simple tools, bots and web projects.'
          new = "I'm Gokul, a developer and BDS student who builds tools, bots, and web projects. I'm interested in creating simple software that solves real problems and is worth using."
          if old not in s:
              raise SystemExit('Old intro text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Update intro text"
          rm .github/workflows/update-intro.yml
          git add .github/workflows/update-intro.yml
          git commit -m "Remove intro update workflow"
          git push
