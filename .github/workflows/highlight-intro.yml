name: Highlight intro roles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Highlight intro roles')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update intro styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_css = '.intro-highlight{color:#b94a48;font-weight:600}'
          new_css = '.role-developer{color:#4f7f68;font-weight:600}.intro-highlight{color:#b94a48;font-weight:600}'
          s = s.replace(old_css, new_css, 1)
          old = 'I\'m Gokul, a developer and <span class="intro-highlight">BDS</span> student'
          new = 'I\'m Gokul, a <span class="role-developer">developer</span> and <span class="intro-highlight">BDS</span> student'
          if old not in s:
              raise SystemExit('intro text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Highlight developer in muted green"
          rm -f .github/workflows/highlight-intro.yml
          git add .github/workflows/highlight-intro.yml
          git commit -m "Remove intro highlight workflow"
          git push
