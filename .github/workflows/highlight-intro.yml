name: Highlight intro roles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Highlight intro roles')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update intro styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('</style></head>', '.role-developer{color:#2f6f5e;font-weight:600}.role-bds{color:#9a5b2f;font-weight:600}</style></head>')
          old = "I'm Gokul, a developer and BDS student who builds tools, bots, and web projects."
          new = "I'm Gokul, a <span class=\"role-developer\">developer</span> and <span class=\"role-bds\">BDS student</span> who builds tools, bots, and web projects."
          if old not in s:
              raise SystemExit('intro text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Highlight intro roles"
          rm -f .github/workflows/highlight-intro.yml
          git add .github/workflows/highlight-intro.yml
          git commit -m "Remove intro highlight workflow"
          git push
