name: Highlight intro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Highlight developer and BDS student')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Highlight intro roles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "I'm Gokul, a developer and BDS student who builds tools, bots, and web projects. I'm interested in creating simple software that solves real problems and is worth using."
          new = "I'm Gokul, a <span class=\"intro-highlight\">developer and BDS student</span> who builds tools, bots, and web projects. I'm interested in creating simple software that solves real problems and is worth using."
          if old not in s:
              raise SystemExit('intro text not found')
          s = s.replace(old, new, 1)
          marker = '.intro p{'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('intro CSS not found')
          end = s.find('}', pos)
          css = '.intro-highlight{color:var(--accent);font-weight:600}'
          s = s[:end+1] + css + s[end+1:]
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Highlight developer and BDS student"
          rm -f .github/workflows/highlight-intro.yml
          git add .github/workflows/highlight-intro.yml
          git commit -m "Remove intro highlight workflow"
          git push
