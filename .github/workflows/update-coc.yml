name: Update Clash of Clans Data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-coc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch player data
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${COC_API_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.clashofclans.com/v1/players/%232GLJLULQU" \
            -o coc-data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coc-data.json
          git diff --cached --quiet || git commit -m "chore: update Clash of Clans player data"
          git push
