<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Kaztral — Gokul's personal portfolio.">
<title>Kaztral — Gokul</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f7f7f5;color:#151515;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{width:min(1000px,88vw);margin:auto;padding:42px 0 120px}
.logo{display:inline-block;padding:12px 20px;border:2px dashed #8b8f94;border-radius:12px;font-size:24px;font-weight:800;letter-spacing:-.04em}
.divider{height:1px;background:#d9dadd;margin:48px 0 72px}
.intro{max-width:760px}
.intro h1{margin:0 0 18px;font-size:clamp(48px,8vw,86px);line-height:.95;letter-spacing:-.07em;font-weight:800}
.intro p{margin:0;color:#68717d;font-size:clamp(20px,3vw,30px);line-height:1.35;letter-spacing:-.02em}
@media(max-width:600px){.page{width:calc(100% - 40px);padding-top:28px}.divider{margin:38px 0 58px}.logo{font-size:20px}.intro h1{font-size:clamp(46px,14vw,70px)}.intro p{font-size:20px}}
</style>
</head>
<body>
<main class="page">
  <div class="logo">Kaztral</div>
  <div class="divider"></div>
  <section class="intro" aria-label="Introduction">
    <h1>Hi, I'm Gokul.</h1>
    <p>BDS student and a developer. I build simple tools, bots and web projects.</p>
  </section>
</main>
</body>
</html>
