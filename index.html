<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Gokul (Kaztral) — BDS student and self-taught developer.">
<title>Gokul — Kaztral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#171717;--muted:#6f6f6f;--accent:#4f46e5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
.logo-wrap{padding:42px 8vw 0}
.logo{display:inline-block;border:1.5px dashed var(--accent);color:var(--accent);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;letter-spacing:-.035em;cursor:pointer;user-select:none;transition:transform .18s ease,background .18s ease}
.logo:active{transform:scale(.94);background:#4f46e50d}
.intro{padding:48px 8vw 100px;display:flex;align-items:flex-start;justify-content:center;flex-direction:column}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:20px}
h1{font-size:clamp(42px,7vw,82px);line-height:1;letter-spacing:-.07em;margin:0 0 28px;font-weight:600}
.intro p{max-width:700px;color:var(--muted);font-size:clamp(17px,2.1vw,24px);font-weight:400;line-height:1.65;margin:0;letter-spacing:-.025em}
@media(max-width:600px){.logo-wrap{padding:28px 22px 0}.intro{padding:42px 22px 80px}.logo{font-size:13px;padding:5px 9px}.intro p{font-size:17px;line-height:1.65}h1{font-size:clamp(40px,12vw,58px);margin-bottom:24px}}
</style>
</head>
<body>
<header class="logo-wrap"><a class="logo" id="kaztralLogo" href="#intro" aria-label="Kaztral">Kaztral</a></header>
<main id="intro" class="intro">
<div class="eyebrow">GOKUL (KAZTRAL) • DEVELOPER</div>
<h1>Hi, I'm Gokul.</h1>
<p>BDS student and a developer. I build simple tools, bots and web projects.</p>
</main>
<script>
(() => {
  const logo = document.getElementById('kaztralLogo');
  let audioContext;
  function touchSound(){
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)return;
    audioContext ||= new AudioContext();
    if(audioContext.state==='suspended')audioContext.resume();
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    const now=audioContext.currentTime;
    oscillator.type='sine';
    oscillator.frequency.setValueAtTime(520,now);
    oscillator.frequency.exponentialRampToValueAtTime(780,now+.06);
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.07,now+.008);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.11);
    oscillator.connect(gain);gain.connect(audioContext.destination);
    oscillator.start(now);oscillator.stop(now+.12);
  }
  logo.addEventListener('pointerdown',touchSound,{passive:true});
})();
</script>
</body>
</html>
