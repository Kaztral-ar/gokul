<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoC Showcase</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#0d1420;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1400px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.stat{background:#182538;border:1px solid #314866;border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;margin-top:4px}
.stat span{font-size:11px;color:#9fb1c8;text-transform:uppercase}
.showcase{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
.card{background:#182538;border:1px solid #314866;border-radius:18px;padding:12px;overflow:hidden}
.card img{display:block;width:100%;height:auto;border-radius:12px}
.updated{text-align:right;color:#7f93ad;font-size:11px;margin:10px 2px}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){body{padding:12px}.showcase{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="stats">
    <div class="stat"><span>Player</span><b id="name">—</b></div>
    <div class="stat"><span>Town Hall</span><b id="th">—</b></div>
    <div class="stat"><span>Trophies</span><b id="trophies">—</b></div>
    <div class="stat"><span>Best</span><b id="best">—</b></div>
    <div class="stat"><span>XP Level</span><b id="xp">—</b></div>
    <div class="stat"><span>War Stars</span><b id="war">—</b></div>
  </div>
  <div class="updated" id="updated">Loading player data…</div>
  <section class="showcase">
    <section class="card"><img src="./assets/images/Base.jpg" alt="Clash of Clans base"></section>
    <section class="card"><img src="./assets/images/Troops.jpg" alt="Clash of Clans troops"></section>
  </section>
</main>
<script>
fetch("./coc-data.json")
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("name").textContent=d.name||"—";
    document.getElementById("th").textContent=d.townHallLevel??"—";
    document.getElementById("trophies").textContent=d.trophies??"—";
    document.getElementById("best").textContent=d.bestTrophies??"—";
    document.getElementById("xp").textContent=d.expLevel??"—";
    document.getElementById("war").textContent=d.warStars??"—";
    document.getElementById("updated").textContent=d.updatedAt?"Updated "+new Date(d.updatedAt).toLocaleString():"Player data not updated yet";
  })
  .catch(()=>document.getElementById("updated").textContent="Player data not available yet");
</script>
</body>
</html>
