<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoC Showcase</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#0d1420;font-family:Arial,sans-serif}.showcase{max-width:1400px;margin:auto;display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:#182538;border:1px solid #314866;border-radius:18px;padding:12px;overflow:hidden}.card img{display:block;width:100%;height:auto;border-radius:12px}@media(max-width:800px){body{padding:12px}.showcase{grid-template-columns:1fr}}</style></head><body><main class="showcase"><section class="card"><img src="./assets/images/Base.jpg" alt="Clash of Clans base"></section><section class="card"><img src="./assets/images/Troops.jpg" alt="Clash of Clans troops"></section></main></body></html>
