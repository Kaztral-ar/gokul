<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clash of Clans</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#7b89aa}
body{font-family:"Trebuchet MS",Arial,sans-serif;color:#fff;overflow-x:hidden}
.page{min-height:100vh;padding:4px;background:#7786a7}
.layout{
 width:100%;max-width:1536px;margin:auto;
 display:grid;grid-template-columns:39.5% 60.5%;
 grid-template-rows:auto auto;
 gap:8px;
}
.panel{
 background:#7281a3;
 border:3px solid #9eabc5;
 border-radius:8px;
 box-shadow:inset 0 0 0 2px #52617e;
 overflow:hidden;
}
.townhall{
 height:365px;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 48%,#d4dceb 0,#a1aec6 44%,#7584a5 76%);
}
.townhall img{width:390px;height:350px;object-fit:contain;filter:drop-shadow(0 15px 8px #3d486080)}
.block{padding:8px 10px}
.title{
 margin:0 0 7px;padding-left:2px;
 font-size:28px;line-height:1;
 font-weight:1000;letter-spacing:-1px;
 text-shadow:3px 3px #39445e;
}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.icon{
 position:relative;aspect-ratio:1;overflow:hidden;
 border:2px solid #53617e;border-radius:8px;
 background:linear-gradient(145deg,#9baaca,#586987);
 box-shadow:inset 0 0 0 1px #b6c0d3;
}
.icon img{width:100%;height:100%;object-fit:contain;display:block;padding:1px}
.level{
 position:absolute;left:2px;bottom:2px;
 min-width:24px;height:20px;padding:0 4px;
 border-radius:5px;background:#29344c;
 border:1px solid #182237;
 color:#fff;font-size:13px;line-height:18px;
 font-weight:1000;text-align:center;
 text-shadow:1px 1px #111;
}
.bottom-left{display:flex;flex-direction:column;gap:8px}
.bottom-right{display:flex;flex-direction:column;gap:8px}
.small-grid{grid-template-columns:repeat(6,1fr)}
.spell-grid{grid-template-columns:repeat(10,1fr)}
.hero-pet{padding:8px 10px}
.hero-pet .title{font-size:27px}
@media(max-width:1000px){
 .layout{grid-template-columns:1fr}
 .townhall{height:330px}
 .grid{grid-template-columns:repeat(10,1fr)}
}
@media(max-width:650px){
 .page{padding:3px}
 .layout{gap:5px}
 .townhall{height:250px}
 .townhall img{width:260px;height:240px}
 .title,.hero-pet .title{font-size:22px}
 .grid,.spell-grid{grid-template-columns:repeat(6,1fr);gap:5px}
 .small-grid{grid-template-columns:repeat(6,1fr)}
 .icon{border-radius:6px}
 .level{font-size:10px;height:17px;line-height:15px;min-width:20px}
}
</style>
</head>
<body>
<div class="page">
<div class="layout">

<div class="panel townhall">
 <img src="https://assets.clashk.ing/town_halls/16.webp" alt="Town Hall 16"
      onerror="this.onerror=null;this.src='https://i1.sndcdn.com/artworks-JgX3nByXADCahSFs-cIkhyQ-t1080x1080.jpg'">
</div>

<div class="panel block">
 <h2 class="title">Troops</h2>
 <div class="grid" id="troops"></div>
</div>

<div class="bottom-left">
 <div class="panel block hero-pet">
  <h2 class="title">Heroes</h2>
  <div class="grid small-grid" id="heroes"></div>
 </div>
 <div class="panel block hero-pet">
  <h2 class="title">Pets</h2>
  <div class="grid small-grid" id="pets"></div>
 </div>
</div>

<div class="bottom-right">
 <div class="panel block">
  <h2 class="title">Spells</h2>
  <div class="grid spell-grid" id="spells"></div>
 </div>
</div>

</div>
</div>

<script>
const data={
troops:[
["barbarian",12],["archer",12],["giant",12],["goblin",9],["wall_breaker",12],
["balloon",11],["wizard",12],["healer",9],["dragon",11],["pekka",11],
["baby_dragon",10],["miner",10],["electro_dragon",7],["ice_golem",6],["dragon_rider",4],
["valkyrie",11],["hog_rider",13],["golem",13],["witch",7],["lava_hound",7],
["bowler",8],["ice_golem",8],["headhunter",3],["yeti",5],["apprentice_warden",4],
["root_rider",5],["electro_titan",4],["furnace",3],["thrower",3],["druid",4],
["meteor_golem",3],["minion",12],["super_minion",10]
],
heroes:[
["barbarian_king",90],["archer_queen",90],["minion_prince",76],
["grand_warden",70],["royal_champion",43],["dragon_duke",15]
],
pets:[
["lassi",12],["electro_owl",10],["mighty_yak",11],
["unicorn",10],["frosty",6],["diggy",1],
["phoenix",2],["spirit_fox",3],["angry_jelly",4],
["seedling",1],["poison_lizard",3],["sneezy",1]
],
spells:[
["lightning",11],["healing",10],["rage",6],["jump",5],["freeze",7],
["clone",8],["invisibility",4],["recall",5],["overgrowth",2],["revive",2],
["poison",10],["earthquake",7],["haste",5],["skeleton",8],["bat",6],
["barbarian_barrel",4],["ice_block",2],["totem",1],["returning",1]
]};

function image(type,key){
 if(type==="spells")return "https://assets.clashk.ing/spells/"+key+".webp";
 return "https://assets.clashk.ing/"+type+"/"+key+"/icon.webp";
}
function render(type){
 const root=document.getElementById(type);
 data[type].forEach(([key,level])=>{
  const item=document.createElement("div");
  item.className="icon";
  item.innerHTML='<img loading="lazy" src="'+image(type,key)+'" alt="'+key.replaceAll("_"," ")+'"><span class="level">'+level+"</span>";
  root.appendChild(item);
 });
}
Object.keys(data).forEach(render);
</script>
</body>
</html>
